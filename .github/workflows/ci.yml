name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (sin LLM ni base de datos)
        run: python -m pytest -q
      - name: Eval gate (huellas y umbrales de evals/results/latest.json)
        run: python -m evals.gate

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/inventory
      INTEGRATION_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/inventory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Esquema, roles y datos sinteticos
        run: |
          python -m scripts.migrate --include-base
          python -m scripts.generate_data
      - name: Integration tests (roles, triggers, pgvector, SQL de referencia)
        run: python -m pytest -q tests/integration

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Infra tests (propiedades de seguridad + cero hallazgos de cdk-nag)
        run: python -m pytest -q tests
      - name: cdk synth (falla si cdk-nag reporta errores)
        run: npx cdk synth --quiet --app "python app.py"
